<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skill Hub</title>
    <script>
      (() => {
        const key = "skill-hub-theme";
        let stored = null;
        try {
          stored = localStorage.getItem(key);
        } catch (_) {
          stored = null;
        }
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = stored === "dark" || (!stored && prefersDark) ? "dark" : "light";
      })();
    </script>
    <style>
      :root {
        font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
        color: #1a1d2e;
        background: #f8f9fb;
      }

      :root[data-theme="dark"] {
        color: #e8f0f8;
        background: #0a0e14;
      }

      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background:
          linear-gradient(135deg, rgba(79, 124, 255, 0.08), transparent 34%),
          #f8f9fb;
      }

      :root[data-theme="dark"] body {
        background:
          linear-gradient(135deg, rgba(93, 138, 255, 0.12), transparent 34%),
          #0a0e14;
      }

      .boot-screen {
        display: grid;
        grid-template-columns: 232px minmax(0, 1fr);
        height: 100%;
        min-height: 0;
        color: #1a1d2e;
      }

      :root[data-theme="dark"] .boot-screen {
        color: #e8f0f8;
      }

      .boot-rail {
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 20px 16px;
        background: rgba(255, 255, 255, 0.95);
        border-right: 1px solid #e2e5ea;
      }

      :root[data-theme="dark"] .boot-rail {
        background: rgba(18, 22, 31, 0.95);
        border-right-color: rgba(146, 169, 203, 0.12);
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 50px;
        padding: 5px;
      }

      .boot-mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        color: #fff;
        background: linear-gradient(135deg, #4f7cff, #7c9aff);
        border-radius: 8px;
        box-shadow: 0 6px 14px rgba(79, 124, 255, 0.24);
      }

      .boot-brand strong,
      .boot-brand span {
        display: block;
      }

      .boot-brand strong {
        font-size: 17px;
        font-weight: 700;
      }

      .boot-brand span {
        margin-top: 2px;
        color: #8792a5;
        font-size: 12px;
        font-weight: 500;
      }

      :root[data-theme="dark"] .boot-brand span {
        color: #7a8ba8;
      }

      .boot-nav {
        display: grid;
        gap: 5px;
      }

      .boot-nav i {
        display: block;
        height: 44px;
        border-radius: 8px;
        background: linear-gradient(90deg, rgba(79, 124, 255, 0.13), rgba(135, 146, 165, 0.08));
      }

      .boot-workspace {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 16px;
        min-width: 0;
        min-height: 0;
        padding: 22px 24px 24px;
      }

      .boot-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .boot-title small,
      .boot-title strong {
        display: block;
      }

      .boot-title small {
        color: #a0aab8;
        font: 700 12px/1.2 "Cascadia Code", Consolas, monospace;
        text-transform: uppercase;
      }

      .boot-title strong {
        margin-top: 4px;
        font-size: 32px;
        line-height: 1.08;
        font-weight: 750;
      }

      .boot-status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        color: #4a5568;
        background: #ffffff;
        border: 1px solid #e2e5ea;
        border-radius: 999px;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
        font-size: 13px;
        font-weight: 500;
      }

      :root[data-theme="dark"] .boot-status {
        color: #b0c0d8;
        background: #121822;
        border-color: rgba(146, 169, 203, 0.12);
      }

      .boot-dot {
        width: 8px;
        height: 8px;
        background: #f59e0b;
        border-radius: 50%;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }

      .boot-panel {
        display: grid;
        place-items: center;
        min-height: 0;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #e2e5ea;
        border-radius: 10px;
        box-shadow: 0 10px 26px rgba(15, 23, 42, 0.055);
      }

      :root[data-theme="dark"] .boot-panel {
        background: rgba(18, 24, 34, 0.96);
        border-color: rgba(146, 169, 203, 0.12);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      }

      .boot-card {
        display: grid;
        gap: 16px;
        width: min(420px, calc(100vw - 48px));
        padding: 28px;
        text-align: center;
      }

      .boot-spinner {
        position: relative;
        width: 42px;
        height: 42px;
        margin: 0 auto;
        border: 3px solid rgba(79, 124, 255, 0.16);
        border-top-color: #4f7cff;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      .boot-card strong {
        font-size: 18px;
        font-weight: 700;
      }

      .boot-card span {
        color: #4a5568;
        font-size: 13px;
        line-height: 1.5;
      }

      :root[data-theme="dark"] .boot-card span {
        color: #b0c0d8;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-pulse {
        50% {
          opacity: 0.38;
        }
      }

      @media (max-width: 820px) {
        .boot-screen {
          grid-template-columns: 1fr;
          grid-template-rows: auto minmax(0, 1fr);
        }

        .boot-rail {
          padding: 14px;
        }

        .boot-nav {
          grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        }

        .boot-workspace {
          padding: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-spinner,
        .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-label="Skill Hub 正在启动">
        <aside class="boot-rail">
          <div class="boot-brand">
            <div class="boot-mark" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="m12 3 8 4-8 4-8-4 8-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                <path d="m4 12 8 4 8-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <path d="m4 17 8 4 8-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <div>
              <strong>Skill Hub</strong>
              <span>Skill Switchboard</span>
            </div>
          </div>
          <div class="boot-nav" aria-hidden="true">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </aside>
        <section class="boot-workspace">
          <header class="boot-topbar">
            <div class="boot-title">
              <small>Starting workspace</small>
              <strong>正在启动</strong>
            </div>
            <div class="boot-status">
              <span class="boot-dot" aria-hidden="true"></span>
              <span>正在载入</span>
            </div>
          </header>
          <div class="boot-panel">
            <div class="boot-card">
              <div class="boot-spinner" aria-hidden="true"></div>
              <strong>准备 Skill Hub 工作区</strong>
              <span>正在连接本地配置、市场缓存与技能索引。</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
